services:
  mongo:
    image: mongo:7
    container_name: invoicing-mongo
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - invoicing-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: invoicing-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/freelance_invoicing
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
    ports:
      - "${API_PORT:-4000}:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: invoicing-client
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8090}:80"

volumes:
  invoicing-mongo-data:
